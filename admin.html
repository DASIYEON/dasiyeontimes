<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 로그인 — 다시연 타임즈</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#1C2B4A;--gold:#A67825;--cream:#FAF8F4;--white:#FFFFFF;--red:#E53E3E;--serif:'Noto Serif KR',serif;--sans:'Noto Sans KR',sans-serif;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:var(--sans);background:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .login-box{background:var(--white);padding:48px 40px;width:380px;max-width:90vw;}
    .logo{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--navy);text-align:center;margin-bottom:4px;}
    .logo em{font-style:normal;color:var(--gold);}
    .subtitle{font-size:11px;color:#8A857E;letter-spacing:2px;text-transform:uppercase;text-align:center;margin-bottom:32px;}
    .form-label{font-size:12px;font-weight:500;color:var(--navy);display:block;margin-bottom:8px;}
    .form-input{width:100%;padding:12px 16px;border:1px solid rgba(28,43,74,0.2);font-size:14px;font-family:var(--sans);outline:none;transition:border 0.2s;}
    .form-input:focus{border-color:var(--navy);}
    .login-btn{width:100%;padding:13px;background:var(--navy);color:var(--white);border:none;cursor:pointer;font-size:14px;font-weight:500;font-family:var(--sans);margin-top:20px;transition:background 0.2s;}
    .login-btn:hover{background:#2E4070;}
    .error-msg{font-size:12px;color:var(--red);text-align:center;margin-top:12px;min-height:18px;}
    .lock-icon{font-size:40px;text-align:center;margin-bottom:20px;}
  </style>
</head>
<body>
<div class="login-box">
  <div class="lock-icon">🔐</div>
  <div class="logo">다시연 <em>타임즈</em></div>
  <div class="subtitle">Admin Access</div>

  <label class="form-label" for="email">이메일</label>
  <input type="email" class="form-input" id="email" placeholder="관리자 이메일" autocomplete="username" style="margin-bottom:16px;"
    onkeydown="if(event.key==='Enter') login()">
  <label class="form-label" for="pw">비밀번호</label>
  <input type="password" class="form-input" id="pw" placeholder="비밀번호를 입력하세요" autocomplete="current-password"
    onkeydown="if(event.key==='Enter') login()">
  <button class="login-btn" onclick="login()">로그인</button>
  <div class="error-msg" id="err"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // 관리자 로그인은 Supabase 계정으로 확인한다 (비밀번호는 이 파일에 없다).
  const _supabase = window.supabase.createClient('https://lguvdtesdetteasnniif.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndXZkdGVzZGV0dGVhc25uaWlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzk1MjUsImV4cCI6MjA5NTY1NTUyNX0.SBUdAzeAwwJ-v2CVYBPdIvTyXLePWZuthNTmWdRjwig');
  // 이미 로그인된 경우 바로 이동
  _supabase.auth.getSession().then(({ data }) => { if(data.session) location.replace('admin-v2.html'); });
  let busy = false;
  async function login() {
    if(busy) return;
    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('pw').value;
    const err = document.getElementById('err');
    if(!email || !pw) { err.textContent = '이메일과 비밀번호를 입력하세요.'; return; }
    busy = true; err.textContent = '확인 중…';
    const { error } = await _supabase.auth.signInWithPassword({ email, password: pw });
    busy = false;
    if(!error) { location.replace('admin-v2.html'); return; }
    err.textContent = error.status === 400 ? '이메일 또는 비밀번호가 올바르지 않습니다.' : '로그인하지 못했습니다. 잠시 후 다시 시도하세요.';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
</script>
</body>
</html>
