<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 로그인 — 다시연 타임즈</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#1C2B4A;--gold:#A67825;--cream:#FAF8F4;--white:#FFFFFF;--red:#E53E3E;--serif:'Noto Serif KR',serif;--sans:'Noto Sans KR',sans-serif;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:var(--sans);background:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .login-box{background:var(--white);padding:48px 40px;width:380px;max-width:90vw;}
    .logo{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--navy);text-align:center;margin-bottom:4px;}
    .logo em{font-style:normal;color:var(--gold);}
    .subtitle{font-size:11px;color:#8A857E;letter-spacing:2px;text-transform:uppercase;text-align:center;margin-bottom:32px;}
    .form-label{font-size:12px;font-weight:500;color:var(--navy);display:block;margin-bottom:8px;}
    .form-input{width:100%;padding:12px 16px;border:1px solid rgba(28,43,74,0.2);font-size:14px;font-family:var(--sans);outline:none;transition:border 0.2s;}
    .form-input:focus{border-color:var(--navy);}
    .login-btn{width:100%;padding:13px;background:var(--navy);color:var(--white);border:none;cursor:pointer;font-size:14px;font-weight:500;font-family:var(--sans);margin-top:20px;transition:background 0.2s;}
    .login-btn:hover{background:#2E4070;}
    .error-msg{font-size:12px;color:var(--red);text-align:center;margin-top:12px;min-height:18px;}
    .lock-icon{font-size:40px;text-align:center;margin-bottom:20px;}
  </style>
</head>
<body>
<div class="login-box">
  <div class="lock-icon">🔐</div>
  <div class="logo">다시연 <em>타임즈</em></div>
  <div class="subtitle">Admin Access</div>

  <label class="form-label">비밀번호</label>
  <input type="password" class="form-input" id="pw" placeholder="비밀번호를 입력하세요"
    onkeydown="if(event.key==='Enter') login()">
  <button class="login-btn" onclick="login()">로그인</button>
  <div class="error-msg" id="err"></div>
</div>

<script>
  // 이미 로그인된 경우 바로 이동
  if(sessionStorage.getItem('dt_admin') === 'true') {
    location.replace('admin-v2.html');
  }

  function login() {
    const pw = document.getElementById('pw').value;
    const err = document.getElementById('err');
    if(pw === 'nstar1109!') {
      sessionStorage.setItem('dt_admin', 'true');
      location.replace('admin-v2.html');
    } else {
      err.textContent = '비밀번호가 올바르지 않습니다.';
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
      setTimeout(() => err.textContent = '', 3000);
    }
  }
</script>
</body>
</html>
