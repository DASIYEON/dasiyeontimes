# 다시연 타임즈 Netlify 설정
# 캐시 정책: HTML은 항상 최신 확인(기본값 유지), 정적 자원은 브라우저 재검증 우선

# CSS·JS — 수정 반영 지연을 막기 위해 매번 재검증
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 사이트 이미지(로고, og-image 등) — 7일 캐시
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

# 2026-09-13 추가 — 구형 기사 링크(article.html?id=X)를 정적 기사 페이지로 영구 이동
# 기존에 외부(카카오톡·SNS·검색)에 공유된 링크를 살린다.
[[redirects]]
  from = "/article.html"
  query = { id = ":id" }
  to = "/articles/:id.html"
  status = 301
  force = true
