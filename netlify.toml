# 다시연 타임즈 Netlify 설정
# 캐시 정책: HTML은 항상 최신 확인(기본값 유지), 정적 자원은 브라우저 캐시 활용

# CSS·JS — 1일 캐시 + 일주일 stale-while-revalidate
# (파일명이 고정이므로 1년 캐시는 위험. 수정 반영이 최대 하루 지연될 수 있음을 감안한 값)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# 사이트 이미지(로고, og-image 등) — 7일 캐시
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
