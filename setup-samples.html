<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root{--navy:#1C2B4A;--gold:#A67825;--cream:#FAF8F4;--white:#FFFFFF;--green:#27AE60;--serif:'Noto Serif KR',serif;--sans:'Noto Sans KR',sans-serif;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:var(--sans);background:var(--cream);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;}
    .card{background:var(--white);border:1px solid rgba(28,43,74,0.15);max-width:520px;width:100%;padding:40px;}
    .logo{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--navy);margin-bottom:6px;}
    .logo em{font-style:normal;color:var(--gold);}
    .subtitle{font-size:11px;color:#8A857E;letter-spacing:2px;text-transform:uppercase;margin-bottom:28px;}
    h2{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--navy);margin-bottom:8px;}
    p{font-size:13px;color:#4A4640;line-height:1.8;margin-bottom:20px;}
    .article-preview{background:var(--cream);padding:14px 16px;margin-bottom:8px;border-left:3px solid var(--gold);}
    .article-preview .cat{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin-bottom:4px;}
    .article-preview .title{font-size:13px;font-weight:600;color:var(--navy);}
    .btn{width:100%;padding:14px;background:var(--navy);color:var(--white);border:none;cursor:pointer;font-size:14px;font-weight:500;font-family:var(--sans);margin-top:20px;transition:background 0.2s;}
    .btn:hover{background:#2E4070;}
    .btn-outline{background:var(--white);color:var(--navy);border:1px solid rgba(28,43,74,0.2);margin-top:8px;}
    .result{margin-top:20px;padding:16px;text-align:center;display:none;}
    .result.success{background:#d4edda;color:#155724;}
    .result.error{background:#f8d7da;color:#721c24;}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">다시연 <em>타임즈</em></div>
  <div class="subtitle">Sample Articles Setup</div>

  <h2>샘플 기사 초기화</h2>
  <p>아래 버튼을 클릭하면 각 카테고리별 샘플 기사 4개가 등록됩니다. 홈페이지와 카테고리 페이지에서 바로 확인할 수 있습니다.</p>

  <div class="article-preview"><div class="cat">마음</div><div class="title">번아웃 이후 다시 일어서는 사람들의 공통점 세 가지</div></div>
  <div class="article-preview"><div class="cat">경영</div><div class="title">폐업 후 6개월, 재기에 성공한 소상공인이 말하는 것</div></div>
  <div class="article-preview"><div class="cat">AI</div><div class="title">중장년을 위한 AI 활용 첫걸음 완전 가이드</div></div>
  <div class="article-preview"><div class="cat">컬럼</div><div class="title">너무 오래 강했던 당신에게 — 쉬어도 된다는 허락</div></div>

  <button class="btn" onclick="initSamples()">✅ 샘플 기사 4개 등록하기</button>
  <button class="btn btn-outline" onclick="location.href='index-v5.html'">← 홈페이지로 가기</button>

  <div class="result" id="result"></div>
</div>

<script>
function fmt(offset) {
  const d = new Date();
  d.setDate(d.getDate() - offset);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

const samples = [
  {
    id: 1000001,
    title: '번아웃 이후 다시 일어서는 사람들의 공통점 세 가지',
    summary: '극도의 소진 상태를 경험한 후 회복한 이들에게는 공통된 심리적 패턴이 존재한다.',
    body: `<p>심리상담 현장에서 번아웃을 경험한 이들을 만날 때마다 느끼는 것이 있다. 무너진 사람보다 다시 일어선 사람이 더 많다는 것이다. 그리고 그들에게는 공통점이 있었다.</p>

<h2>첫 번째 공통점 — 쉬어도 된다는 허락</h2>
<p>번아웃에서 회복한 사람들이 가장 먼저 한 일은 의외로 단순했다. 스스로에게 쉬어도 된다는 허락을 내린 것이다. 강해야 한다는 내면의 명령으로부터 잠시 자유로워지는 순간, 비로소 회복이 시작됐다.</p>
<blockquote>무너지는 것은 약함이 아니라 인간다움이다. 우리는 모두 어느 순간, 쉬어도 된다는 허락이 필요하다.</blockquote>

<h2>두 번째 공통점 — 몸의 신호를 먼저 들었다</h2>
<p>뇌가 지쳤다는 신호를 가장 먼저 보내는 곳은 몸이다. 만성 피로, 수면 장애, 소화 불량. 회복한 이들은 이 신호를 무시하지 않았다. 몸이 먼저 회복되어야 마음이 따라온다는 것을 몸으로 이해했다.</p>

<h2>세 번째 공통점 — 완벽하지 않아도 됨을 받아들였다</h2>
<p>번아웃의 근저에는 종종 완벽주의가 있다. 완벽하지 않은 결과물을 세상에 내놓는 것, 남들에게 약한 모습을 보이는 것에 대한 두려움. 회복한 이들은 이 두려움과 정면으로 마주하는 과정을 거쳤다.</p>
<ul>
  <li>완벽하지 않아도 충분히 가치 있음을 인정하기</li>
  <li>타인의 평가에서 자신의 가치를 분리하기</li>
  <li>작은 성공의 감각을 매일 쌓아가기</li>
</ul>

<h2>마치며</h2>
<p>번아웃은 끝이 아니다. 오히려 내면이 보내는 중요한 메시지다. 지금 너무 힘들다면, 그것은 당신이 그동안 너무 열심히 살아왔다는 증거다. 잠시 멈추는 것은 포기가 아니라 더 멀리 가기 위한 준비다.</p>`,
    category: '마음',
    image: '',
    author: '최형규',
    status: '발행',
    date: new Date(Date.now() - 0).toISOString(),
    dateStr: fmt(0),
  },
  {
    id: 1000002,
    title: '폐업 후 6개월, 재기에 성공한 소상공인이 말하는 것',
    summary: '희망리턴패키지 컨설팅 현장에서 만난 진짜 회복의 조건.',
    body: `<p>소상공인 재기 컨설팅을 하다 보면 폐업 이후의 이야기를 많이 듣게 된다. 문을 닫는 순간보다 그 이후가 더 힘들다고 말하는 분들이 많다. 그런데 6개월이 지나 다시 일어선 분들은 공통적으로 이렇게 말한다.</p>

<h2>"폐업은 끝이 아니라 전환점이었습니다"</h2>
<p>10년간 식당을 운영하다 폐업한 김모 씨(51세)는 처음 6개월을 "아무것도 할 수 없는 시간"이었다고 회상했다. 하지만 그 시간이 오히려 자신을 돌아보는 계기가 됐다고 했다.</p>
<blockquote>"사업을 하면서 한 번도 내가 진짜 뭘 원하는지 생각해본 적이 없었어요. 폐업하고 나서야 처음으로 그 질문을 할 수 있었습니다."</blockquote>

<h2>재기의 조건 — 심리 회복이 먼저다</h2>
<p>많은 분들이 재기를 준비하면서 돈과 아이템부터 생각한다. 하지만 현장에서 보면 심리적 회복이 선행되지 않은 재기는 오래가지 못하는 경우가 많다.</p>
<ul>
  <li>실패에 대한 죄책감 해소</li>
  <li>자기 효능감 회복</li>
  <li>새로운 방향에 대한 명확한 그림</li>
</ul>

<h2>희망리턴패키지를 제대로 활용하는 법</h2>
<p>소상공인진흥공단의 희망리턴패키지는 단순한 지원금이 아니다. 사업 정리부터 재취업·재창업까지 전 과정을 지원하는 종합 프로그램이다. 핵심은 심리상담부터 시작하는 것이다.</p>

<h2>마치며</h2>
<p>폐업은 사업의 실패가 아니라 한 챕터의 마무리다. 다음 챕터를 어떻게 시작하느냐가 더 중요하다. 당신의 경험과 실패는 이미 소중한 자산이다.</p>`,
    category: '경영',
    image: '',
    author: '최형규',
    status: '발행',
    date: new Date(Date.now() - 86400000).toISOString(),
    dateStr: fmt(1),
  },
  {
    id: 1000003,
    title: '중장년을 위한 AI 활용 첫걸음 완전 가이드',
    summary: '복잡한 것 없이 내일 당장 업무에 써먹는 실전법. 강의 자료부터 보고서까지.',
    body: `<p>AI를 써보고 싶은데 어디서 시작해야 할지 모르겠다는 분들이 많다. 특히 40~50대 강사·상담사·컨설턴트 분들에게 AI는 아직 낯선 도구다. 하지만 한 번 익히면 업무 시간을 절반으로 줄여주는 강력한 파트너가 된다.</p>

<h2>AI, 뭐가 좋은 건가요?</h2>
<p>한 마디로 말하면 "생각을 글로 빠르게 바꿔주는 도구"다. 강의 자료 만들기, 보고서 초안 작성, 기획서 구성, 이메일 작성 등 텍스트 기반의 작업 대부분에서 시간을 획기적으로 줄여준다.</p>

<h2>첫 번째 — ChatGPT 또는 Claude 가입하기</h2>
<p>가장 먼저 할 일은 AI 도구에 가입하는 것이다. ChatGPT(chat.openai.com) 또는 Claude(claude.ai) 중 하나를 선택해 무료로 시작할 수 있다.</p>
<ul>
  <li>ChatGPT: 가장 널리 알려진 AI, 다양한 기능</li>
  <li>Claude: 긴 글 요약과 문서 작업에 강점</li>
</ul>

<h2>두 번째 — 프롬프트 작성의 기본</h2>
<p>AI에게 일을 시키는 글을 프롬프트라고 한다. 좋은 프롬프트의 핵심은 역할·목적·형식을 명확히 하는 것이다.</p>
<blockquote>나쁜 예: "강의 자료 만들어줘"
좋은 예: "나는 중장년 직업전환을 주제로 강의하는 강사야. 50대 직장인을 대상으로 한 2시간 강의의 목차와 각 파트별 핵심 내용을 만들어줘."</blockquote>

<h2>지금 당장 써먹는 프롬프트 3가지</h2>
<ul>
  <li>강의 자료: "○○ 주제로 ○○ 대상 ○시간 강의 목차 만들어줘"</li>
  <li>상담 보고서: "다음 상담 내용을 전문적인 보고서 형식으로 정리해줘: [내용 입력]"</li>
  <li>기획서 초안: "○○ 프로그램 기획서 개요를 작성해줘. 목적, 대상, 내용, 기대효과 포함"</li>
</ul>

<h2>마치며</h2>
<p>AI는 당신의 경험과 전문성을 대체하지 않는다. 오히려 그 전문성을 더 빠르게, 더 많은 사람에게 전달하도록 도와주는 도구다. 오늘 딱 10분만 써보자.</p>`,
    category: 'AI',
    image: '',
    author: '최형규',
    status: '발행',
    date: new Date(Date.now() - 172800000).toISOString(),
    dateStr: fmt(2),
  },
  {
    id: 1000004,
    title: '너무 오래 강했던 당신에게 — 쉬어도 된다는 허락',
    summary: '강함을 유지하느라 지쳐버린 사람들에게 전하는 위로와 방향.',
    body: `<p>오래 강해야 했던 사람들이 있다. 가정의 기둥이었거나, 조직의 리더였거나, 아니면 그냥 쉽게 무너지면 안 된다는 믿음을 오래 품고 살아온 이들이다.</p>
<p>이들의 공통점이 있다. 피로를 나중으로 미룬다. 지금은 버텨야 할 때라고 스스로에게 말한다. 그리고 그 나중은 좀처럼 오지 않는다.</p>

<h2>강함이 습관이 된 사람들</h2>
<p>어린 시절부터 강해야 했던 사람들이 있다. 집안의 장남·장녀로 태어나 어른 역할을 해야 했거나, 일찍 사회에 나가 스스로를 부양해야 했던 사람들. 이들에게 강함은 선택이 아니라 생존의 방식이었다.</p>
<blockquote>그런데 강함이 너무 오래되면 어느 순간 강함이 자신인지, 자신이 강함인지 구분이 안 된다.</blockquote>

<h2>무너지는 것이 약함이 아닌 이유</h2>
<p>심리학적으로 볼 때 감정을 억제하는 것은 단기적으로는 기능한다. 하지만 장기적으로는 반드시 대가가 온다. 번아웃, 신체 증상, 관계의 단절.</p>
<p>무너지는 경험은 오히려 내면이 보내는 중요한 신호다. 이제는 다른 방식이 필요하다고 알려주는 것이다.</p>

<h2>쉬어도 된다는 허락을 스스로에게</h2>
<p>외부에서 누군가 쉬어도 된다고 말해줄 때까지 기다리지 마라. 그 허락은 스스로 내려야 한다. 당신이 잠시 멈춰도 세상은 돌아간다. 당신이 약한 모습을 보여도 당신의 가치는 변하지 않는다.</p>
<ul>
  <li>오늘 하루 아무것도 생산하지 않아도 괜찮다</li>
  <li>도움을 요청하는 것은 약함이 아니라 지혜다</li>
  <li>지금 이 순간 쉬는 것이 가장 용감한 선택일 수 있다</li>
</ul>

<h2>마치며 — 당신에게 전하는 말</h2>
<p>너무 오래 강했던 당신에게. 이제 잠시 내려놓아도 된다. 당신이 쌓아온 것들은 사라지지 않는다. 잠시 쉰다고 해서 당신이 지금까지 걸어온 길의 가치가 줄어들지 않는다. 오히려 더 멀리 가기 위해 지금 이 순간의 휴식이 필요하다.</p>`,
    category: '컬럼',
    image: '',
    author: '최형규',
    status: '발행',
    date: new Date(Date.now() - 259200000).toISOString(),
    dateStr: fmt(3),
  }
];

function initSamples() {
  try {
    const existing = JSON.parse(localStorage.getItem('dt_articles') || '[]');
    // 샘플 ID가 이미 있으면 덮어쓰기
    const filtered = existing.filter(a => a.id < 1000000);
    const merged = [...samples, ...filtered];
    localStorage.setItem('dt_articles', JSON.stringify(merged));

    const result = document.getElementById('result');
    result.style.display = 'block';
    result.className = 'result success';
    result.innerHTML = `
      ✅ 샘플 기사 4개가 등록되었습니다!<br><br>
      <strong>마음</strong> · <strong>경영</strong> · <strong>AI</strong> · <strong>컬럼</strong> 각 1개씩<br><br>
      <a href="index-v5.html" style="color:#155724;font-weight:600;">→ 홈페이지에서 확인하기</a>
    `;

    document.querySelector('.btn').textContent = '✅ 등록 완료!';
    document.querySelector('.btn').disabled = true;
    document.querySelector('.btn').style.opacity = '0.6';

  } catch(e) {
    const result = document.getElementById('result');
    result.style.display = 'block';
    result.className = 'result error';
    result.textContent = '오류가 발생했습니다: ' + e.message;
  }
}

// 이미 등록되어 있는지 확인
window.onload = function() {
  const existing = JSON.parse(localStorage.getItem('dt_articles') || '[]');
  const hasSamples = existing.some(a => a.id >= 1000000);
  if(hasSamples) {
    document.querySelector('.btn').textContent = '🔄 샘플 기사 다시 등록하기';
  }
};
</script>
</body>
