name: Generate static pages, sitemap and RSS

on:
  schedule:
    # 월·수·금 KST 23:00 (UTC 14:00) — 발행 후 검수 완료 시각 기준 반영
    - cron: '0 14 * * 1,3,5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 2026-09-13 추가 — 정적 생성기가 index.html을 덮어쓰기 전, 수기 관리 index.html을 1회 보관한다.
      # 보관 파일이 이미 있으면 건너뛴다 (최초 1회만 실행).
      - name: Backup hand-managed index.html (first run only)
        run: |
          if [ ! -f index-pre-static-backup.html ]; then
            cp index.html index-pre-static-backup.html
            echo "index.html → index-pre-static-backup.html 보관"
          else
            echo "보관 파일 존재 — 건너뜀"
          fi

      # 2026-09-13 추가 — 저장소에 이미 있던 scripts/generate_static.py 를 실행한다.
      # index.html 과 articles/{id}.html 을 templates/ 로부터 생성한다.
      - name: Generate index.html and articles/*.html
        run: python3 scripts/generate_static.py

      - name: Generate sitemap.xml and rss.xml
        run: python3 scripts/generate_feeds.py

      - name: Commit if changed
        run: |
          git config user.name "dasiyeon-bot"
          git config user.email "actions@github.com"
          git add -A index.html index-pre-static-backup.html articles/ sitemap.xml rss.xml
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 정적 기사 페이지/sitemap/RSS 자동 갱신 ($(date +'%Y-%m-%d'))"
            git push
          fi
